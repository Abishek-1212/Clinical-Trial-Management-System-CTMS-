server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ctms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

jwt:
  secret: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7ad10177798491b0aa2c1202a8
  expiration-ms: 28800000       # 8 hours for staff
  participant-expiration-ms: 86400000  # 24 hours for participants

app:
  encryption-key: ctms-aes256-key-32byteslong!!!!!
  cors-allowed-origins: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
  session-timeout-minutes: 15
  max-login-attempts: 5
  password-expiry-days: 60

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ctms: INFO
    org.springframework.security: WARN
