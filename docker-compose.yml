version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ctms_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ctms_db
    ports:
      - "3306:3306"
    volumes:
      - ctms_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ctms_mysql_data:
